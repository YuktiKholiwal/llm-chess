[project]
name = "chess-reasoning-eval"
version = "0.1.0"
description = "Measures whether a model's chess reasoning is true, not just whether its move is right."
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
    "zstandard>=0.23.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8.3.4"]

# Nothing here is meant to be installed as a library; the entry point is
# `python -m eval`, which finds the package on the working directory.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
