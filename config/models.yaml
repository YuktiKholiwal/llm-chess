# Every model is queried with a byte-identical prompt, so a difference in scores
# is a difference in the model rather than in how it was asked. Adding a model
# here is all that is needed to include it in a run.
#
# Reasoning effort is `low` throughout. At `medium` these models spend five to
# thirty thousand output tokens per puzzle, which costs several times more and
# pushes some of them past their output ceiling before they can answer. Effort
# is part of the measurement, so it is recorded in the run manifest.

provider:
  # Any OpenAI-compatible endpoint. The Vercel AI Gateway and OpenRouter both
  # accept the identical request body -- including `usage.include`, which is
  # what lets cost come from the provider rather than a local rate table, and
  # the unified `reasoning.effort` knob.
  #
  # For OpenRouter instead:
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
  base_url: https://ai-gateway.vercel.sh/v1
  api_key_env: AI_GATEWAY_API_KEY

models:
  - id: anthropic/claude-sonnet-5
    label: Claude Sonnet 5
    reasoning: { effort: low }

  - id: openai/gpt-5.2
    label: GPT-5.2
    reasoning: { effort: low }

  # The open-weight slot. deepseek-v4-pro was tried first and cannot be used:
  # at both medium and low effort it spends its entire output budget on
  # reasoning and is truncated before it ever writes a <move>, on every task.
  # Qwen terminates, and exposes reasoning content the way the runner expects.
  - id: qwen/qwen3.8-2.4t-a95b
    label: Qwen3.8 A95B
    reasoning: { effort: low }

# Claim extraction, and resolving a prose plan to its first move. Both jobs are
# mechanical rewriting rather than chess, so a cheap model is the right tool --
# and using a strong one would risk the extractor quietly correcting the
# reasoning it is supposed to be transcribing.
extractor:
  id: anthropic/claude-haiku-4.5
  label: Claude Haiku 4.5

engine:
  # Resolved on PATH. Override with an absolute path if you keep it elsewhere.
  path: stockfish
  depth: 20
  # Plan and played-move scoring only ever asks for one line.
  threads: 1
  # Modest on purpose: twelve workers share one engine, and a large hash
  # bought nothing measurable here while adding real memory pressure.
  hash_mb: 32

limits:
  # Checked before every request; the run stops rather than overshooting.
  max_cost_usd: 40.0
  request_timeout_s: 300.0
  # Rate limits and provider blips are expected over ~800 calls and are retried
  # with backoff. Auth and access failures are not retried at all.
  max_transient_retries: 5
  # Consecutive request failures that end the run. An unreachable API is not a
  # model scoring zero, and reporting it as one would be a lie.
  abort_after_consecutive_errors: 3
  # Requests in flight at once. The cost cap is checked before each is
  # submitted, so a run can overshoot it by at most this many calls.
  concurrency: 2

tasks:
  source_url: https://database.lichess.org/lichess_db_puzzle.csv.zst
  bands: [1200, 1600, 2000, 2400]
  per_band: 50
  # A puzzle joins a band if its rating is within this many points of the
  # centre, so the bands are separated rather than adjacent.
  band_tolerance: 100
  # Below this, a rating is too noisy to place in a band at all.
  max_rating_deviation: 100
  # Puzzles nobody has played are unvetted; the rating attached to them is a
  # prior rather than a measurement.
  min_plays: 200
  seed: 20260905
