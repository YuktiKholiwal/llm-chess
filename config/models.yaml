# Every model is queried through OpenRouter with a byte-identical prompt, so a
# difference in scores is a difference in the model rather than in how it was
# asked. Adding a model here is all that is needed to include it in a run.

models:
  - id: anthropic/claude-sonnet-5
    label: Claude Sonnet 5
    reasoning: { effort: medium }

  - id: openai/gpt-5.2
    label: GPT-5.2
    reasoning: { effort: medium }

  - id: deepseek/deepseek-v4-pro-0813
    label: DeepSeek V4 Pro
    reasoning: { effort: medium }

# Claim extraction, and resolving a prose plan to its first move. Both jobs are
# mechanical rewriting rather than chess, so a cheap model is the right tool --
# and using a strong one would risk the extractor quietly correcting the
# reasoning it is supposed to be transcribing.
extractor:
  id: anthropic/claude-haiku-4.5
  label: Claude Haiku 4.5

engine:
  # Resolved on PATH. Override with an absolute path if you keep it elsewhere.
  path: stockfish
  depth: 20
  # Plan and played-move scoring only ever asks for one line.
  threads: 1
  hash_mb: 256

limits:
  # Checked before every request; the run stops rather than overshooting.
  max_cost_usd: 25.0
  request_timeout_s: 300.0
  # Rate limits and provider blips are expected over ~800 calls and are retried
  # with backoff. Auth and access failures are not retried at all.
  max_transient_retries: 5
  # Consecutive request failures that end the run. An unreachable API is not a
  # model scoring zero, and reporting it as one would be a lie.
  abort_after_consecutive_errors: 3

tasks:
  source_url: https://database.lichess.org/lichess_db_puzzle.csv.zst
  bands: [1200, 1600, 2000, 2400]
  per_band: 50
  # A puzzle joins a band if its rating is within this many points of the
  # centre, so the bands are separated rather than adjacent.
  band_tolerance: 100
  # Below this, a rating is too noisy to place in a band at all.
  max_rating_deviation: 100
  # Puzzles nobody has played are unvetted; the rating attached to them is a
  # prior rather than a measurement.
  min_plays: 200
  seed: 20260905
